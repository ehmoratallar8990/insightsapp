name: Release
# Fully automatic releases: whenever main contains a Cargo.toml version that has no
# `v<version>` tag yet, build macOS / Windows / Linux, tag the commit and publish a
# GitHub release with all binaries attached. To ship: bump `version` and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already released — nothing to do (bump the version in Cargo.toml to release)."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $TAG"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            asset: Insight-macOS-universal.zip
          - os: windows-latest
            asset: Insight-Windows-x86_64.zip
          - os: ubuntu-22.04
            asset: Insight-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Test
        run: cargo test --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh
          mv dist/${{ matrix.asset }} .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/insight.exe pkg/Insight.exe
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p pkg/insight
          cp target/release/insight pkg/insight/
          cp assets/icon-256.png pkg/insight/insight.png
          cp packaging/insight.desktop pkg/insight/
          tar -C pkg -czf ${{ matrix.asset }} insight

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ls -la release-assets
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" release-assets/* \
            --title "Insight $TAG" \
            --generate-notes \
            --notes "Install: see the README (one-line installers for macOS, Linux and Windows)."
