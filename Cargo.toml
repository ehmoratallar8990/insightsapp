[package]
name = "insight"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ehmoratallar8990/insightsapp"
description = "Instant, cross-platform file search with storage insights and on-device media understanding — 100% Rust."
license = "MIT"

[features]
default = ["download"]
# Built-in HTTPS download of the CLIP model on first use.
download = ["dep:ureq"]
# Use Apple's Accelerate framework for CPU BLAS (macOS).
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# NVIDIA GPU (Linux / Windows).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
anyhow = "1.0.104"
bincode = "1"
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
env_logger = "0.11.11"
epaint = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "rayon"] }
jwalk = "0.9.0"
libc = "0.2.191"
log = "0.4.35"
memchr = "2.8.3"
notify = "8.2.2"
open = "5.4.5"
parking_lot = "0.13.0"
rayon = "1.12.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk"] }
trash = "5.4.0"
ureq = { version = "3", optional = true }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

# macOS: the media model always runs on the Apple GPU (Metal), falling back to CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.1", features = ["metal"] }
candle-nn = { version = "=0.9.1", features = ["metal"] }
candle-transformers = { version = "=0.9.1", features = ["metal"] }
# Pinned: newer 0.9.x kernel releases are not API-compatible with candle-core 0.9.1.
candle-metal-kernels = "=0.9.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Keep heavy numeric deps fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3
